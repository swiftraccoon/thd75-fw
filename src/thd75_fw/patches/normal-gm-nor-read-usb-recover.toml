name = "normal-gm-nor-read-usb-recover"
description = """
Fail-closed patch from the exact hardware-qualified normal-gm-nor-read
updater to the independently rebuilt and statically audited V18 USB
mass-storage recovery firmware. V18 services every host READ request
as a bounded sequence of stock one-sector CMD17 partition reads, aborts
on the first failure, and permits one boot-global full-reinitialization
and complete replay. It also removes the stock geometry refresh's
incorrect increment of the MBR partition sector count, so READ CAPACITY
no longer exposes one nonexistent terminal LBA. A seqlocked aggregate
record captures request, sector, physical-command, first-failure, and
recovery evidence.

The diagnostic build deliberately retargets the GM reader from NOR
0x60000000 back to DDR 0xC0000000 so the host can attest its live
V16T, V16G, and V17R telemetry records. It does not add a NOR write
primitive. The complete source/result firmware images, source updater,
plaintext KEX, re-encrypted resource, and repacked updater are
hash-pinned.

Changed-byte entries are sorted by flat FIRMWARE offset. Changes
separated by at most 64 bytes form one logical cluster; every cluster
has an exact source context with at least 32 bytes of surrounding
data and 16-byte-aligned bounds.
"""
