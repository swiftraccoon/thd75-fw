name = "service-9r-nor-read"
description = """
Retarget the existing TH-D75 V1.03 service CAT 9R read handler to copy from
CPU-visible NOR at 0x60000000 + the request offset, and expand its accepted
offset window from 0x50000 to 0x200000. This is a 19-byte edit to the stock
handler: it adds no handler, command-table entry, code cave, dumper, UART path,
or write/erase operation. The stock source-aware CAT response-routing code,
256-byte stack buffer, and `9R OOOOOO,LL\\r` grammar remain unchanged. Leaving
that routing code untouched does not prove service-mode 9R reachability over
Bluetooth SPP. Qualify USB-C first. On macOS, Bluetooth qualification requires
reuse of the native IOBluetooth RFCOMM transport already present in the sibling
Kenwood project. Its fixed baseline currently refuses Bluetooth because a
canceled native blocking write can outlive its future and make bounded teardown
impossible; repair and re-audit that transport before qualification. The
current pyserial path also fails closed as unaudited. Exact service-mode SPP
remains unqualified.

The range covers the complete two MiB immediately before the official main
FIRMWARE image at NOR 0x60200000, without assuming internal bootloader
partition boundaries. This patch is experimental: baseline stock service 9R
and its maximum response over USB-C before flashing, retain a verified stock
restore image, and begin a patched-radio test with a one-byte USB-C read.
"""
target_firmware = "TH-D75 V1.03 official FIRMWARE"

# Fail closed on the complete source image and both complete instruction
# windows. The result hashes make accidental changes outside this manifest
# impossible to emit through either the raw-FIRMWARE or plaintext-KEX path.
source_sha256 = "193963ca4b7a38392815686893858eec20292b629fe999f10b93a22a3a8e4001"
result_sha256 = "c7cd9d300a73c984408df39c50d2fb7802f826b7300cb8ffb7122c366c010e91"
result_kex_sha256 = "fa95a673156c2d47b06a85fd6038682bbe1adfcbd1b7bdfdb7529ecfc1ca9541"

# The repack route is narrower still: accept only the exact official updater,
# then pin both the re-ciphered resource and the complete replacement EXE.
source_updater_sha256 = "a76f0c80525c942c983bd62494109e15270380a6b5964d6c2a6b4726331f60ad"
result_encrypted_resource_sha256 = "4fe12582ea43a1d7debaf97ea6135df7a2d13aa5d68168507f8947a22ac2f0de"
result_updater_sha256 = "5c4a5661dbabab24db32d542ffb3c5273103c6b4e6eff3f3c42f1da4791b029f"
change_count = 19

